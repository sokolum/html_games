<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Surge Prototype</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:Arial,Helvetica,sans-serif;touch-action:none;user-select:none}body{display:flex;align-items:center;justify-content:center}canvas{display:block;width:100%;height:100%;background:#8fcf72}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #0008;font-weight:800}#top{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;font-size:14px;letter-spacing:.06em}#weapon{position:absolute;top:max(42px,calc(env(safe-area-inset-top) + 30px));left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.14em}#version{position:absolute;left:12px;bottom:max(10px,env(safe-area-inset-bottom));font-size:10px;opacity:.62;letter-spacing:.12em}#message{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;font-size:30px;line-height:1.15;display:none}#message small{display:block;font-size:13px;margin-top:10px;opacity:.8;letter-spacing:.08em}</style>
</head><body><canvas id="game"></canvas><div id="hud"><div id="top"><span id="kills">KILLS 0</span><span id="time">LEVEL 1 · 45</span></div><div id="weapon">ASSAULT RIFLE · DMG 12 · 6.0/s</div><div id="version">SURGE · PROTOTYPE v0.10</div><div id="message"></div></div>
<script>
/* ============================================================
   SURGE GAME BALANCE SETTINGS — central source of truth
   ============================================================ */
const SETTINGS={GAME_VERSION:'0.10',LEVEL_SECONDS:45,PLAYER_SPEED:720,BULLET_SPEED:1050,ROAD_HORIZON_Y:-.12,ROAD_TOP_WIDTH:.12,ROAD_BOTTOM_WIDTH:.45,ROAD_PERSPECTIVE:.82,CHARACTER_SCALE:1.42,UPGRADE_TIMES:[10,24,36]};
const WEAPONS={
  pistol:{name:'Pistol',damage:20,fireRate:3,projectiles:1,hitFactor:1.00},
  smg:{name:'SMG',damage:8,fireRate:8,projectiles:1,hitFactor:.95},
  assaultRifle:{name:'Assault Rifle',damage:12,fireRate:6,projectiles:1,hitFactor:.98},
  heavyRifle:{name:'Heavy Rifle',damage:25,fireRate:3,projectiles:1,hitFactor:.95},
  shotgun:{name:'Shotgun',damage:10,fireRate:1.3,projectiles:6,hitFactor:.70},
  machineGun:{name:'Machine Gun',damage:9,fireRate:9,projectiles:1,hitFactor:.90}
};
const UPGRADES={
  A:{name:'Fire Rate',type:'permanent',hp:48,fireRateMultiplier:1.20},
  B:{name:'Impact',type:'permanent',hp:60,damageMultiplier:1.25},
  C:{name:'Dual Weapon',type:'permanent',hp:96,weaponCount:2,efficiencyPerWeapon:.70},
  D:{name:'Spread Shot',type:'permanent',hp:72,sideDamageMultiplier:.50,sideHitFactor:.40},
  E:{name:'Piercing Bullets',type:'permanent',hp:84,maxTargets:2,secondTargetDamageMultiplier:.65,secondTargetChance:.50},
  F:{name:'Explosive Ammo',type:'special',hp:72,everyShots:30,splashDamageMultiplier:.50},
  G:{name:'Freeze Ammo',type:'special',hp:72,everyShots:30,slowMultiplier:.50,duration:2},
  H:{name:'Knock Back',type:'special',hp:60,everyShots:15,knockbackDistance:.08},
  I:{name:'Homing Shot',type:'special',hp:72,everyShots:30,trackingStrength:.10}
};
const ENEMIES={
  weak:{name:'Weak',hp:36,speed:1.05,score:10},normal:{name:'Normal',hp:60,speed:1.00,score:20},strong:{name:'Strong',hp:96,speed:.95,score:35},heavy:{name:'Heavy',hp:180,speed:.80,score:60},elite:{name:'Elite',hp:300,speed:.90,score:100},boss:{name:'Boss',hp:1000,speed:.70,score:500}
};
const LEVELS={1:[
  {from:0,to:10,spawnInterval:3.0,maxEnemies:2,classes:['weak','normal']},
  {from:10,to:20,spawnInterval:2.5,maxEnemies:3,classes:['weak','normal']},
  {from:20,to:30,spawnInterval:2.0,maxEnemies:4,classes:['normal','weak']},
  {from:30,to:40,spawnInterval:1.5,maxEnemies:5,classes:['normal','strong']},
  {from:40,to:45,spawnInterval:1.2,maxEnemies:6,classes:['normal','strong']}
]};
const ACTIVE_WEAPON='assaultRifle';
const fireRateImg=new Image();fireRateImg.src='assets/fire-rate.png';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),killsEl=document.getElementById('kills'),timeEl=document.getElementById('time'),weaponEl=document.getElementById('weapon'),messageEl=document.getElementById('message');let W=0,H=0,dpr=1,last=performance.now(),elapsed=0,spawnClock=0,fireClock=0,kills=0,ended=false,nextUpgradeIndex=0;let bullets=[],enemies=[],particles=[],upgrades=[];const player={x:.5,y:.84,targetX:.5};const activeUpgrades={A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0,I:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function roadWidthAt(y){const t=clamp((y-SETTINGS.ROAD_HORIZON_Y)/(1.08-SETTINGS.ROAD_HORIZON_Y),0,1),p=Math.pow(t,SETTINGS.ROAD_PERSPECTIVE);return W*(SETTINGS.ROAD_TOP_WIDTH+(SETTINGS.ROAD_BOTTOM_WIDTH-SETTINGS.ROAD_TOP_WIDTH)*p)}function roadBounds(y){const rw=roadWidthAt(y);return[(W-rw)/2,(W+rw)/2]}function worldX(nx,y){const b=roadBounds(y);return b[0]+nx*(b[1]-b[0])}function scaleAt(y){const depth=clamp((y-SETTINGS.ROAD_HORIZON_Y)/(1-SETTINGS.ROAD_HORIZON_Y),0,1);return(.16+Math.pow(depth,1.08)*1.34)*SETTINGS.CHARACTER_SCALE}
function setTarget(clientX){const b=roadBounds(player.y);player.targetX=clamp((clientX-b[0])/(b[1]-b[0]),.05,.95)}addEventListener('pointerdown',e=>setTarget(e.clientX));addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setTarget(e.clientX)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')player.targetX-=.12;if(e.key==='ArrowRight'||e.key==='d')player.targetX+=.12;player.targetX=clamp(player.targetX,.05,.95)});
function currentWeapon(){return WEAPONS[ACTIVE_WEAPON]}function fireRate(){return currentWeapon().fireRate*Math.pow(UPGRADES.A.fireRateMultiplier,activeUpgrades.A)}function bulletDamage(){return currentWeapon().damage*Math.pow(UPGRADES.B.damageMultiplier,activeUpgrades.B)}function weaponCount(){return activeUpgrades.C>0?UPGRADES.C.weaponCount:currentWeapon().projectiles}function updateWeaponHud(){const w=currentWeapon();weaponEl.textContent=w.name.toUpperCase()+' · DMG '+bulletDamage().toFixed(1)+' · '+fireRate().toFixed(1)+'/s'+(activeUpgrades.C?' · x2':'')}
function currentPhase(){return LEVELS[1].find(p=>elapsed>=p.from&&elapsed<p.to)||LEVELS[1][LEVELS[1].length-1]}function pickEnemyClass(classes){return classes[Math.floor(Math.random()*classes.length)]}function spawnEnemy(){const phase=currentPhase();if(enemies.length>=phase.maxEnemies)return;const type=pickEnemyClass(phase.classes),cfg=ENEMIES[type];enemies.push({type,x:.12+Math.random()*.76,y:-.025,hp:cfg.hp,maxHp:cfg.hp,speed:70*cfg.speed,phase:Math.random()*6.28})}function spawnUpgrade(code='A'){const cfg=UPGRADES[code];upgrades.push({code,x:.2+Math.random()*.6,y:-.02,hp:cfg.hp,maxHp:cfg.hp,speed:50})}function activateUpgrade(code){activeUpgrades[code]++;updateWeaponHud();}
function shoot(){const count=weaponCount(),baseDamage=bulletDamage();for(let i=0;i<count;i++){const offset=count>1?(i-(count-1)/2)*.022:0;const damage=count>1?baseDamage*UPGRADES.C.efficiencyPerWeapon:baseDamage;bullets.push({x:player.x+offset,y:player.y-.045,speed:SETTINGS.BULLET_SPEED,damage});particles.push({x:player.x+offset,y:player.y-.055,vx:(Math.random()-.5)*.02,vy:-.12-Math.random()*.08,life:.09,max:.09,type:'flash'})}}function burst(x,y,type='hit'){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.18,life:.32+Math.random()*.2,max:.5,type})}
function update(dt){if(ended)return;elapsed+=dt;timeEl.textContent='LEVEL 1 · '+Math.ceil(Math.max(0,SETTINGS.LEVEL_SECONDS-elapsed));const b=roadBounds(player.y),px=worldX(player.x,player.y),tx=worldX(player.targetX,player.y),maxMove=SETTINGS.PLAYER_SPEED*dt,npx=px+clamp(tx-px,-maxMove,maxMove);player.x=clamp((npx-b[0])/(b[1]-b[0]),.05,.95);while(nextUpgradeIndex<SETTINGS.UPGRADE_TIMES.length&&elapsed>=SETTINGS.UPGRADE_TIMES[nextUpgradeIndex]){spawnUpgrade('A');nextUpgradeIndex++}fireClock+=dt;if(fireClock>=1/fireRate()){fireClock=0;shoot()}const phase=currentPhase();spawnClock+=dt;if(spawnClock>=phase.spawnInterval){spawnClock=0;spawnEnemy()}bullets.forEach(bu=>bu.y-=bu.speed*dt/H);bullets=bullets.filter(bu=>bu.y>-.08);enemies.forEach(e=>{e.y+=e.speed*dt/H;e.x+=Math.sin(elapsed*2.2+e.phase)*dt*.012});upgrades.forEach(u=>u.y+=u.speed*dt/H);
for(let bi=bullets.length-1;bi>=0;bi--){const bu=bullets[bi];let consumed=false;for(let ui=upgrades.length-1;ui>=0;ui--){const u=upgrades[ui],dx=worldX(bu.x,bu.y)-worldX(u.x,u.y),dy=(bu.y-u.y)*H,r=30*scaleAt(u.y);if(dx*dx+dy*dy<r*r){bullets.splice(bi,1);consumed=true;u.hp-=bu.damage;burst(u.x,u.y,'upgradeHit');if(u.hp<=0){const code=u.code;burst(u.x,u.y,'upgrade');upgrades.splice(ui,1);activateUpgrade(code)}break}}if(consumed)continue;for(let ei=enemies.length-1;ei>=0;ei--){const e=enemies[ei],dx=worldX(bu.x,bu.y)-worldX(e.x,e.y),dy=(bu.y-e.y)*H,r=20*scaleAt(e.y);if(dx*dx+dy*dy<r*r){bullets.splice(bi,1);e.hp-=bu.damage;burst(e.x,e.y);if(e.hp<=0){enemies.splice(ei,1);kills++;killsEl.textContent='KILLS '+kills}break}}}
upgrades=upgrades.filter(u=>u.y<player.y+.08);for(const e of enemies){if(e.y>=player.y-.015){end(false);return}}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);if(elapsed>=SETTINGS.LEVEL_SECONDS)end(true)}
function end(win){ended=true;messageEl.style.display='block';messageEl.innerHTML=(win?'LEVEL COMPLETE':'OVERRUN')+'<small>'+kills+' KILLS · TAP TO RESTART</small>';setTimeout(()=>addEventListener('pointerdown',restart,{once:true}),250)}function restart(){elapsed=spawnClock=fireClock=kills=0;ended=false;nextUpgradeIndex=0;bullets=[];enemies=[];particles=[];upgrades=[];for(const k in activeUpgrades)activeUpgrades[k]=0;player.x=player.targetX=.5;killsEl.textContent='KILLS 0';updateWeaponHud();messageEl.style.display='none'}
function drawRoad(){ctx.fillStyle='#79b85f';ctx.fillRect(0,0,W,H);ctx.fillStyle='#6fa653';for(let i=0;i<22;i++){const y=((i*.071+elapsed*.028)%1)*H;ctx.globalAlpha=.14;ctx.beginPath();ctx.ellipse((i%2?W*.12:W*.88),y,36+(i%4)*7,10+(i%3)*3,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const topY=H*SETTINGS.ROAD_HORIZON_Y,bottomY=H*1.08,bt=roadBounds(SETTINGS.ROAD_HORIZON_Y),bb=roadBounds(1.08);ctx.beginPath();ctx.moveTo(bt[0],topY);ctx.lineTo(bt[1],topY);ctx.lineTo(bb[1],bottomY);ctx.lineTo(bb[0],bottomY);ctx.closePath();ctx.fillStyle='#555d61';ctx.fill();ctx.strokeStyle='#d2c8a9';ctx.lineWidth=5;ctx.stroke();ctx.save();ctx.beginPath();ctx.moveTo(bt[0],topY);ctx.lineTo(bt[1],topY);ctx.lineTo(bb[1],bottomY);ctx.lineTo(bb[0],bottomY);ctx.clip();for(let i=0;i<12;i++){const yy=((i*.11+elapsed*.055)%1.2)-.1,depth=clamp((yy-SETTINGS.ROAD_HORIZON_Y)/(1.08-SETTINGS.ROAD_HORIZON_Y),0,1),half=roadWidthAt(yy)*.48;ctx.strokeStyle='rgba(255,255,255,.055)';ctx.lineWidth=1+depth*2;ctx.beginPath();ctx.moveTo(W/2-half,yy*H);ctx.lineTo(W/2+half,yy*H);ctx.stroke()}ctx.strokeStyle='#e8e3c8';ctx.lineWidth=3;ctx.setLineDash([22,24]);ctx.lineDashOffset=(elapsed*110)%46;ctx.beginPath();ctx.moveTo(W/2,topY);ctx.lineTo(W/2,bottomY);ctx.stroke();ctx.restore();ctx.setLineDash([])}
function drawPlayer(){const x=worldX(player.x,player.y),y=player.y*H,s=scaleAt(player.y),step=Math.sin(elapsed*10)*3*s;ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+22*s,24*s,8*s,0,0,6.28);ctx.fill();ctx.strokeStyle='#1e2933';ctx.lineWidth=6*s;ctx.beginPath();ctx.moveTo(x-5*s,y+12*s);ctx.lineTo(x-9*s+step,y+29*s);ctx.moveTo(x+5*s,y+12*s);ctx.lineTo(x+9*s-step,y+29*s);ctx.stroke();ctx.fillStyle='#31445a';ctx.fillRect(x-12*s,y-7*s,24*s,27*s);ctx.fillStyle='#d3a47b';ctx.beginPath();ctx.arc(x,y-16*s,11*s,0,6.28);ctx.fill();ctx.fillStyle='#2d3b2a';ctx.beginPath();ctx.arc(x,y-19*s,12*s,3.2,6.2);ctx.fill();const gunOffsets=weaponCount()>1?[-8,8]:[0];for(const go of gunOffsets){ctx.strokeStyle='#151b20';ctx.lineWidth=5*s;ctx.beginPath();ctx.moveTo(x+go*s,y-2*s);ctx.lineTo(x+go*s,y-31*s);ctx.stroke();ctx.strokeStyle='#9da6ad';ctx.lineWidth=2*s;ctx.beginPath();ctx.moveTo(x+go*s,y-31*s);ctx.lineTo(x+go*s,y-43*s);ctx.stroke()}}
function drawEnemy(e){const x=worldX(e.x,e.y),y=e.y*H,s=scaleAt(e.y),step=Math.sin(elapsed*8+e.phase)*3*s;ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(x,y+20*s,20*s,7*s,0,0,6.28);ctx.fill();ctx.strokeStyle='#53653d';ctx.lineWidth=6*s;ctx.beginPath();ctx.moveTo(x-5*s,y+10*s);ctx.lineTo(x-9*s+step,y+28*s);ctx.moveTo(x+5*s,y+10*s);ctx.lineTo(x+9*s-step,y+28*s);ctx.stroke();ctx.fillStyle='#596b44';ctx.fillRect(x-11*s,y-6*s,22*s,25*s);ctx.fillStyle='#91a56b';ctx.beginPath();ctx.arc(x,y-14*s,11*s,0,6.28);ctx.fill();ctx.fillStyle='#3d4b31';ctx.beginPath();ctx.arc(x,y-18*s,11*s,3.2,6.1);ctx.fill();ctx.fillStyle='#1119';ctx.fillRect(x-15*s,y-34*s,30*s,4*s);ctx.fillStyle='#e85d5d';ctx.fillRect(x-15*s,y-34*s,30*s*(e.hp/e.maxHp),4*s)}
function drawUpgrade(u){const x=worldX(u.x,u.y),y=u.y*H,s=scaleAt(u.y),bob=Math.sin(elapsed*4+u.x*8)*3*s,w=74*s,h=74*s;ctx.save();ctx.translate(x,y+bob);if(fireRateImg.complete&&fireRateImg.naturalWidth){ctx.drawImage(fireRateImg,-w/2,-h/2,w,h)}else{ctx.fillStyle='#596b44';ctx.fillRect(-w/2,-h/2,w,h)}ctx.fillStyle='#111b';ctx.fillRect(-w*.38,-h*.60,w*.76,5*s);ctx.fillStyle='#64e8ff';ctx.fillRect(-w*.38,-h*.60,w*.76*(u.hp/u.maxHp),5*s);ctx.restore()}
function drawBullet(b){const x=worldX(b.x,b.y),y=b.y*H,s=scaleAt(b.y);ctx.strokeStyle='#ffe77a';ctx.lineWidth=Math.max(2,3*s);ctx.beginPath();ctx.moveTo(x,y+10);ctx.lineTo(x,y-17);ctx.stroke()}function drawParticles(){for(const p of particles){const x=worldX(p.x,p.y),y=p.y*H,a=clamp(p.life/p.max,0,1);ctx.globalAlpha=a;ctx.fillStyle=p.type==='flash'?'#fff3a1':p.type==='upgrade'?'#64e8ff':p.type==='upgradeHit'?'#ffd36a':'#b9d36d';ctx.beginPath();ctx.arc(x,y,p.type==='upgrade'?6:p.type==='flash'?7:4,0,6.28);ctx.fill()}ctx.globalAlpha=1}
function draw(){drawRoad();enemies.slice().sort((a,b)=>a.y-b.y).forEach(drawEnemy);upgrades.forEach(drawUpgrade);bullets.forEach(drawBullet);drawPlayer();drawParticles()}function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();requestAnimationFrame(loop)}updateWeaponHud();spawnEnemy();requestAnimationFrame(loop);
</script></body></html>
