<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Surge Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:Arial,Helvetica,sans-serif;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100%;height:100%;background:#8fcf72}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #0008;font-weight:800}
#top{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;font-size:14px;letter-spacing:.06em}
#title{position:absolute;top:max(42px,calc(env(safe-area-inset-top) + 30px));left:50%;transform:translateX(-50%);font-size:12px;opacity:.75;letter-spacing:.18em}
#message{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;font-size:30px;line-height:1.15;display:none}
#message small{display:block;font-size:13px;margin-top:10px;opacity:.8;letter-spacing:.08em}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div id="top"><span id="kills">KILLS 0</span><span id="time">LEVEL 1 · 45</span></div><div id="title">SURGE · PROTOTYPE v0.3</div><div id="message"></div></div>
<script>
/* ============================================================
   SURGE — PROTOTYPE v0.3
   GAME SETTINGS — change these values first when tuning gameplay
   ============================================================ */
const SETTINGS={
  GAME_VERSION:'0.3',
  LEVEL_SECONDS:45,
  PLAYER_SPEED:720,
  FIRE_RATE:7.5,
  BULLET_SPEED:1050,
  BULLET_DAMAGE:1,
  ENEMY_HEALTH:2,
  ENEMY_SPEED_MIN:115,
  ENEMY_SPEED_MAX:185,
  SPAWN_INTERVAL_START:0.82,
  SPAWN_INTERVAL_END:0.28,
  MAX_ENEMIES:55,
  ROAD_HORIZON_Y:0.27,
  ROAD_TOP_WIDTH:0.44,
  ROAD_BOTTOM_WIDTH:0.90,
  CHARACTER_SCALE:1.30
};

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const killsEl=document.getElementById('kills'),timeEl=document.getElementById('time'),messageEl=document.getElementById('message');
let W=0,H=0,dpr=1,last=performance.now(),elapsed=0,spawnClock=0,fireClock=0,kills=0,ended=false;
let bullets=[],enemies=[],particles=[];
const player={x:.5,y:.84,targetX:.5};

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function roadWidthAt(y){const t=clamp((y-SETTINGS.ROAD_HORIZON_Y)/(.97-SETTINGS.ROAD_HORIZON_Y),0,1);return W*(SETTINGS.ROAD_TOP_WIDTH+(SETTINGS.ROAD_BOTTOM_WIDTH-SETTINGS.ROAD_TOP_WIDTH)*t)}
function roadBounds(y){const rw=roadWidthAt(y);return[(W-rw)/2,(W+rw)/2]}
function setTarget(clientX){const b=roadBounds(player.y);player.targetX=clamp((clientX-b[0])/(b[1]-b[0]),.05,.95)}
addEventListener('pointerdown',e=>setTarget(e.clientX));addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setTarget(e.clientX)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')player.targetX-=.12;if(e.key==='ArrowRight'||e.key==='d')player.targetX+=.12;player.targetX=clamp(player.targetX,.05,.95)});

function worldX(nx,y){const b=roadBounds(y);return b[0]+nx*(b[1]-b[0])}
function scaleAt(y){const depth=clamp((y-SETTINGS.ROAD_HORIZON_Y)/(1-SETTINGS.ROAD_HORIZON_Y),0,1);return (.52+depth*.92)*SETTINGS.CHARACTER_SCALE}
function spawnEnemy(){if(enemies.length>=SETTINGS.MAX_ENEMIES)return;const progress=elapsed/SETTINGS.LEVEL_SECONDS;const hp=SETTINGS.ENEMY_HEALTH+(progress>.65?1:0);enemies.push({x:.12+Math.random()*.76,y:SETTINGS.ROAD_HORIZON_Y+.005,hp,maxHp:hp,speed:SETTINGS.ENEMY_SPEED_MIN+Math.random()*(SETTINGS.ENEMY_SPEED_MAX-SETTINGS.ENEMY_SPEED_MIN),phase:Math.random()*6.28})}
function shoot(){bullets.push({x:player.x,y:player.y-.045,speed:SETTINGS.BULLET_SPEED});for(let i=0;i<3;i++)particles.push({x:player.x,y:player.y-.055,vx:(Math.random()-.5)*.02,vy:-.12-Math.random()*.08,life:.09,max:.09,type:'flash'})}
function burst(x,y){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.18,life:.32+Math.random()*.2,max:.5,type:'hit'})}

function update(dt){if(ended)return;elapsed+=dt;const remain=Math.max(0,SETTINGS.LEVEL_SECONDS-elapsed);timeEl.textContent='LEVEL 1 · '+Math.ceil(remain);
 const b=roadBounds(player.y),px=worldX(player.x,player.y),tx=worldX(player.targetX,player.y);const maxMove=SETTINGS.PLAYER_SPEED*dt;const npx=px+clamp(tx-px,-maxMove,maxMove);player.x=clamp((npx-b[0])/(b[1]-b[0]),.05,.95);
 fireClock+=dt;if(fireClock>=1/SETTINGS.FIRE_RATE){fireClock=0;shoot()}
 const p=clamp(elapsed/SETTINGS.LEVEL_SECONDS,0,1),interval=SETTINGS.SPAWN_INTERVAL_START+(SETTINGS.SPAWN_INTERVAL_END-SETTINGS.SPAWN_INTERVAL_START)*p;spawnClock+=dt;if(spawnClock>=interval){spawnClock=0;spawnEnemy();if(p>.55&&Math.random()<.35)spawnEnemy()}
 bullets.forEach(bu=>bu.y-=bu.speed*dt/H);bullets=bullets.filter(bu=>bu.y>SETTINGS.ROAD_HORIZON_Y-.03);
 enemies.forEach(e=>{e.y+=e.speed*dt/H;e.x+=Math.sin(elapsed*2.2+e.phase)*dt*.012});
 for(let bi=bullets.length-1;bi>=0;bi--){const bu=bullets[bi];for(let ei=enemies.length-1;ei>=0;ei--){const e=enemies[ei];const dx=worldX(bu.x,bu.y)-worldX(e.x,e.y),dy=(bu.y-e.y)*H;const r=20*scaleAt(e.y);if(dx*dx+dy*dy<r*r){bullets.splice(bi,1);e.hp-=SETTINGS.BULLET_DAMAGE;burst(e.x,e.y);if(e.hp<=0){enemies.splice(ei,1);kills++;killsEl.textContent='KILLS '+kills}break}}}
 for(const e of enemies){if(e.y>=player.y-.015){end(false);return}}
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);
 if(elapsed>=SETTINGS.LEVEL_SECONDS)end(true)
}
function end(win){ended=true;messageEl.style.display='block';messageEl.innerHTML=(win?'LEVEL COMPLETE':'OVERRUN')+'<small>'+kills+' KILLS · TAP TO RESTART</small>';setTimeout(()=>addEventListener('pointerdown',restart,{once:true}),250)}
function restart(){elapsed=spawnClock=fireClock=kills=0;ended=false;bullets=[];enemies=[];particles=[];player.x=player.targetX=.5;killsEl.textContent='KILLS 0';messageEl.style.display='none'}

function drawRoad(){ctx.fillStyle='#7dbd61';ctx.fillRect(0,0,W,H);ctx.fillStyle='#769d58';for(let i=0;i<18;i++){const y=((i*.083+elapsed*.035)%1)*H;ctx.globalAlpha=.16;ctx.beginPath();ctx.ellipse((i%2?W*.1:W*.9),y,42,13,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 const topY=H*SETTINGS.ROAD_HORIZON_Y,bottomY=H*.97,bt=roadBounds(SETTINGS.ROAD_HORIZON_Y),bb=roadBounds(.97);ctx.beginPath();ctx.moveTo(bt[0],topY);ctx.lineTo(bt[1],topY);ctx.lineTo(bb[1],bottomY);ctx.lineTo(bb[0],bottomY);ctx.closePath();ctx.fillStyle='#626a6e';ctx.fill();ctx.strokeStyle='#d6d1b7';ctx.lineWidth=5;ctx.stroke();
 ctx.save();ctx.beginPath();ctx.moveTo(bt[0],topY);ctx.lineTo(bt[1],topY);ctx.lineTo(bb[1],bottomY);ctx.lineTo(bb[0],bottomY);ctx.clip();ctx.strokeStyle='#e8e3c8';ctx.lineWidth=3;ctx.setLineDash([22,24]);ctx.lineDashOffset=(elapsed*110)%46;ctx.beginPath();ctx.moveTo(W/2,topY);ctx.lineTo(W/2,bottomY);ctx.stroke();ctx.restore();ctx.setLineDash([])}
function drawPlayer(){const x=worldX(player.x,player.y),y=player.y*H,s=scaleAt(player.y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+18*s,22*s,8*s,0,0,6.28);ctx.fill();ctx.fillStyle='#253447';ctx.fillRect(x-10*s,y-7*s,20*s,27*s);ctx.fillStyle='#d3a47b';ctx.beginPath();ctx.arc(x,y-13*s,10*s,0,6.28);ctx.fill();ctx.fillStyle='#283622';ctx.beginPath();ctx.arc(x,y-16*s,11*s,3.2,6.2);ctx.fill();ctx.strokeStyle='#1b2026';ctx.lineWidth=5*s;ctx.beginPath();ctx.moveTo(x+4*s,y-3*s);ctx.lineTo(x+5*s,y-28*s);ctx.stroke();ctx.strokeStyle='#9da6ad';ctx.lineWidth=2*s;ctx.beginPath();ctx.moveTo(x+5*s,y-28*s);ctx.lineTo(x+5*s,y-39*s);ctx.stroke()}
function drawEnemy(e){const x=worldX(e.x,e.y),y=e.y*H,s=scaleAt(e.y);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(x,y+15*s,19*s,7*s,0,0,6.28);ctx.fill();ctx.fillStyle='#5d7043';ctx.fillRect(x-10*s,y-4*s,20*s,24*s);ctx.fillStyle='#91a56b';ctx.beginPath();ctx.arc(x,y-11*s,10*s,0,6.28);ctx.fill();ctx.strokeStyle='#91a56b';ctx.lineWidth=5*s;ctx.beginPath();ctx.moveTo(x-8*s,y);ctx.lineTo(x-17*s,y+8*s);ctx.moveTo(x+8*s,y);ctx.lineTo(x+17*s,y+8*s);ctx.stroke();if(e.maxHp>2){ctx.fillStyle='#1119';ctx.fillRect(x-14*s,y-30*s,28*s,4*s);ctx.fillStyle='#e85d5d';ctx.fillRect(x-14*s,y-30*s,28*s*(e.hp/e.maxHp),4*s)}}
function drawBullet(b){const x=worldX(b.x,b.y),y=b.y*H,s=scaleAt(b.y);ctx.strokeStyle='#ffe77a';ctx.lineWidth=Math.max(2,3*s);ctx.beginPath();ctx.moveTo(x,y+10);ctx.lineTo(x,y-15);ctx.stroke()}
function drawParticles(){for(const p of particles){const x=worldX(p.x,p.y),y=p.y*H,a=clamp(p.life/p.max,0,1);ctx.globalAlpha=a;ctx.fillStyle=p.type==='flash'?'#fff3a1':'#b9d36d';ctx.beginPath();ctx.arc(x,y,p.type==='flash'?7:4,0,6.28);ctx.fill()}ctx.globalAlpha=1}
function draw(){drawRoad();enemies.slice().sort((a,b)=>a.y-b.y).forEach(drawEnemy);bullets.forEach(drawBullet);drawPlayer();drawParticles()}
function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();requestAnimationFrame(loop)}
for(let i=0;i<3;i++)spawnEnemy();requestAnimationFrame(loop);
</script>
</body>
</html>
